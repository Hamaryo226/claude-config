name: Static validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z '*.mjs' | xargs -0 -n1 node --check

      - name: Parse tracked JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(git ls-files -z '*.json')

      - name: Run evaluation harness tests
        run: node --test eval/tests/*.test.mjs

      - name: Validate personal profile
        run: node eval/selfcheck.mjs --profile personal

      - name: Validate work profile
        run: node eval/selfcheck.mjs --profile work

      - name: Check shared Skill copies
        shell: bash
        run: |
          diff -u skills/project-analyze/SKILL.md work/skills/project-analyze/SKILL.md
          diff -u skills/codebase-conventions/SKILL.md work/skills/codebase-conventions/SKILL.md
